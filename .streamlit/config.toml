[theme]
base = "light"

primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
borderColor = "#E2E8F0"
linkColor = "#2563EB"

showWidgetBorder = true
showSidebarBorder = true

baseRadius = "10px"
buttonRadius = "8px"

baseFontSize = 15
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

headingFontSizes = ["2rem", "1.45rem", "1.15rem", "1rem", "0.95rem", "0.85rem"]
headingFontWeights = [700, 700, 600, 600, 600, 500]
linkUnderline = false

redColor = "#DC2626"
orangeColor = "#D97706"
yellowColor = "#CA8A04"
greenColor = "#16A34A"
blueColor = "#2563EB"
violetColor = "#7C3AED"
grayColor = "#64748B"

chartCategoricalColors = ["#2563EB", "#7C3AED", "#0EA5E9", "#16A34A", "#F59E0B", "#EF4444", "#64748B"]
chartSequentialColors = ["#EFF6FF", "#DBEAFE", "#BFDBFE", "#93C5FD", "#60A5FA", "#3B82F6", "#2563EB", "#1D4ED8", "#1E40AF", "#1E3A8A"]

[theme.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EFF2F7"
textColor = "#0F172A"
borderColor = "#E2E8F0"
